name: Sestavení

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  windows:
    name: Program čtečky pro Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build:win
      - run: npm run build:win32
      - shell: bash
        run: |
          cp README.md dist/Prompter-win32-x64/NAVOD.md
          cp README.md dist/Prompter-win32-ia32/NAVOD.md
      - run: |
          Compress-Archive -Path dist/Prompter-win32-x64 -DestinationPath Prompter-Windows-64bit.zip
          Compress-Archive -Path dist/Prompter-win32-ia32 -DestinationPath Prompter-Windows-32bit.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Prompter-Windows
          path: Prompter-Windows-*.zip
      - name: Verze z package.json
        id: ver
        shell: bash
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Vydání ke stažení (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: Prompter ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Prompter-Windows-64bit.zip**: běžná Windows 10/11 (64bit). **Prompter-Windows-32bit.zip**: starší 32bitová Windows.
            Rozbal a spusť `Prompter.exe`. Návod je v souboru NAVOD.md uvnitř složky.
          files: Prompter-Windows-*.zip

  pages:
    name: Webový editor (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp -r index.html sw.js manifest.webmanifest css js img vendor fonts site/
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
        continue-on-error: true
