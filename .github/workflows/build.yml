name: Sestavení

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  windows:
    name: Program čtečky pro Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build:win
      - run: npm run build:win32
      - run: |
          Compress-Archive -Path dist/Prompter-win32-x64 -DestinationPath Prompter-Windows-64bit.zip
          Compress-Archive -Path dist/Prompter-win32-ia32 -DestinationPath Prompter-Windows-32bit.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Prompter-Windows
          path: Prompter-Windows-*.zip
      - name: Vydání (jen pro tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Prompter-Windows-*.zip

  pages:
    name: Webový editor (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp -r index.html sw.js manifest.webmanifest css js img site/
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - uses: actions/deploy-pages@v4
        continue-on-error: true
